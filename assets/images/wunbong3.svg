<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="skyGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D4D6B"/>
      <stop offset="35%" stop-color="#678BAA"/>
      <stop offset="70%" stop-color="#D6E4EE"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="pagodaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ECEAE4"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C5C2BA"/>
    </linearGradient>
    <radialGradient id="sunBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FFEBB8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FAD082" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAD082" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyGrad3)"/>

  <!-- Radiant Sun next to the Pagoda (日邊 - 해 언저리) -->
  <circle cx="510" cy="200" r="180" fill="url(#sunBurst)"/>
  <circle cx="510" cy="200" r="45" fill="#FFFFFF"/>

  <!-- Sun Rays Shining on Pagoda (日邊雪) -->
  <g stroke="#FFF6D8" stroke-width="2.5" opacity="0.6">
    <line x1="510" y1="200" x2="250" y2="380"/>
    <line x1="510" y1="200" x2="320" y2="460"/>
    <line x1="510" y1="200" x2="390" y2="520"/>
    <line x1="510" y1="200" x2="680" y2="100"/>
    <line x1="510" y1="200" x2="780" y2="280"/>
  </g>

  <!-- Distant Blue Ridge Line -->
  <path d="M0 480 Q 300 420 600 460 T 1200 430 L 1200 675 L 0 675 Z" fill="#7D98AB" opacity="0.4"/>

  <!-- Mountain Cliff Ground -->
  <path d="M100 460 Q 350 440 600 460 Q 900 470 1200 520 L 1200 675 L 0 675 L 0 520 Z" fill="#3E4C41"/>

  <!-- Elegant Stone Pagoda Glowing like Pure Snow (塔影日邊雪) -->
  <g transform="translate(340, 150)">
    <!-- Finial (상륜부) -->
    <path d="M40 0 L 45 35 L 35 35 Z" fill="#B4842E"/>
    <circle cx="40" cy="10" r="6" fill="#B4842E"/>
    <ellipse cx="40" cy="22" rx="9" ry="4" fill="#B4842E"/>
    <!-- Level 3 Roof & Body -->
    <path d="M10 50 L 70 50 L 55 35 L 25 35 Z" fill="url(#pagodaGrad)" stroke="#B8B3A8" stroke-width="1.5"/>
    <rect x="25" y="50" width="30" height="28" fill="url(#pagodaGrad)" stroke="#B8B3A8" stroke-width="1.5"/>
    <!-- Level 2 Roof & Body -->
    <path d="M0 92 L 80 92 L 65 78 L 15 78 Z" fill="url(#pagodaGrad)" stroke="#B8B3A8" stroke-width="1.5"/>
    <rect x="20" y="92" width="40" height="38" fill="url(#pagodaGrad)" stroke="#B8B3A8" stroke-width="1.5"/>
    <!-- Level 1 Roof & Body -->
    <path d="M-12 145 L 92 145 L 75 130 L 5 130 Z" fill="url(#pagodaGrad)" stroke="#B8B3A8" stroke-width="1.5"/>
    <rect x="15" y="145" width="50" height="50" fill="url(#pagodaGrad)" stroke="#B8B3A8" stroke-width="1.5"/>
    <!-- Base Platform (기단부) -->
    <rect x="0" y="195" width="80" height="35" fill="#DDD8CE" stroke="#A8A398" stroke-width="2"/>
    <rect x="-15" y="230" width="110" height="30" fill="#CAC4B8" stroke="#969186" stroke-width="2"/>
    <!-- Glowing Shadow Projection across the stones (塔影) -->
    <path d="M95 260 L 280 295 L 200 310 L 60 260 Z" fill="#202922" opacity="0.35"/>
  </g>

  <!-- Mighty Ancient Pine Tree on Right singing in the High Sky Wind (松聲天半風) -->
  <g transform="translate(760, 160)">
    <!-- Twisting Pine Trunk -->
    <path d="M160 380 Q 140 280 170 190 Q 200 110 260 70 Q 290 50 340 30" fill="none" stroke="#4A3B2C" stroke-width="28" stroke-linecap="round"/>
    <path d="M175 220 Q 90 190 20 180" fill="none" stroke="#4A3B2C" stroke-width="14" stroke-linecap="round"/>
    <path d="M215 130 Q 140 90 90 70" fill="none" stroke="#4A3B2C" stroke-width="11" stroke-linecap="round"/>
    <!-- Lush Wind-swept Pine Needles (松聲) -->
    <g fill="#1F3D2B" opacity="0.95">
      <ellipse cx="20" cy="175" rx="55" ry="32" transform="rotate(-15 20 175)"/>
      <ellipse cx="80" cy="70" rx="65" ry="36" transform="rotate(-20 80 70)"/>
      <ellipse cx="180" cy="90" rx="55" ry="30" transform="rotate(-10 180 90)"/>
      <ellipse cx="260" cy="50" rx="60" ry="32" transform="rotate(10 260 50)"/>
      <ellipse cx="340" cy="25" rx="50" ry="28" transform="rotate(-5 340 25)"/>
    </g>
    <!-- Gust of Wind Swirls in Half-Sky (天半風) -->
    <path d="M-100 80 Q 50 20 220 50 T 400 30" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M-60 120 Q 80 70 240 100 T 420 70" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M-30 160 Q 100 120 260 140" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Scholar Boy Listening to the Pine Wind peacefully -->
  <g transform="translate(560, 430) scale(0.95)">
    <!-- Boy Sitting quietly on a warm stone -->
    <ellipse cx="30" cy="70" rx="35" ry="12" fill="#58685C"/>
    <!-- Robe -->
    <path d="M15 35 Q 30 55 45 70 L 5 70 Q 5 50 15 35 Z" fill="#F4EFE6" stroke="#3C483F" stroke-width="1.8"/>
    <!-- Arms resting on knees -->
    <circle cx="30" cy="22" r="12" fill="#E8B896"/>
    <!-- Head turned toward pine tree, listening attentively -->
    <path d="M20 18 Q 30 8 40 18 L 36 10 Q 28 6 22 10 Z" fill="#1C1D1F"/>
    <rect x="27" y="3" width="6" height="7" fill="#1C1D1F" rx="2"/>
    <circle cx="36" cy="20" r="1.8" fill="#1C1D1F"/>
    <path d="M34 25 Q 37 28 40 25" fill="none" stroke="#B93826" stroke-width="1.5"/>
  </g>

  <!-- Musical Wind Notes / Fluttering Pine needles -->
  <g fill="#B4842E" opacity="0.7">
    <circle cx="700" cy="220" r="3"/>
    <circle cx="670" cy="250" r="4"/>
    <circle cx="730" cy="280" r="2.5"/>
  </g>

  <!-- Seal -->
  <rect x="1100" y="45" width="55" height="55" fill="#B93826" rx="8"/>
  <text x="1127" y="80" font-family="'Noto Serif KR', serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">松</text>
  <text x="1127" y="125" font-family="'Gowun Batang', serif" font-size="16" font-weight="700" fill="#2D4D6B" text-anchor="middle">塔影</text>
</svg>