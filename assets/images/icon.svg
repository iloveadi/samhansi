<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE6D5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#85530B"/>
    </linearGradient>
    <radialGradient id="redSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D94B34"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A2A1A" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#E0D2BC" stroke-width="4" filter="url(#softShadow)"/>
  
  <!-- Traditional Border Inset -->
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Korean Seal Badge -->
  <g transform="translate(256, 230)">
    <rect x="-100" y="-100" width="200" height="200" rx="36" fill="url(#redSeal)" filter="url(#softShadow)"/>
    <rect x="-92" y="-92" width="184" height="184" rx="30" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Traditional Calligraphy Character: 寓 (우) -->
    <text x="0" y="65" font-family="'Noto Serif KR', serif" font-size="130" font-weight="bold" fill="#FFFDF8" text-anchor="middle">寓</text>
  </g>

  <!-- Bottom Title Label Ribbon -->
  <g transform="translate(256, 395)">
    <rect x="-140" y="-28" width="280" height="56" rx="28" fill="#3C483F" filter="url(#softShadow)"/>
    <text x="0" y="9" font-family="'Noto Serif KR', sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
      최치원 · 눈도장
    </text>
  </g>

  <!-- Plum Blossom Accent -->
  <circle cx="120" cy="120" r="16" fill="#F472B6" fill-opacity="0.8"/>
  <circle cx="106" cy="110" r="13" fill="#FB7185" fill-opacity="0.7"/>
  <circle cx="134" cy="110" r="13" fill="#FB7185" fill-opacity="0.7"/>
  <circle cx="112" cy="134" r="13" fill="#FDA4AF" fill-opacity="0.7"/>
  <circle cx="128" cy="134" r="13" fill="#FDA4AF" fill-opacity="0.7"/>
  <circle cx="120" cy="120" r="6" fill="#FDE047"/>
</svg>
