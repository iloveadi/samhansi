<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#432851"/>
      <stop offset="35%" stop-color="#843B62"/>
      <stop offset="65%" stop-color="#E26D5C"/>
      <stop offset="85%" stop-color="#FFB070"/>
      <stop offset="100%" stop-color="#FFE8C2"/>
    </linearGradient>
    <linearGradient id="dustCityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F3B59"/>
      <stop offset="100%" stop-color="#231728"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B89772"/>
      <stop offset="100%" stop-color="#725539"/>
    </linearGradient>
  </defs>

  <!-- Splendid Sunset Mountain Sky with Rosy Clouds (煙霞 - 안개와 고운 노을) -->
  <rect width="1200" height="675" fill="url(#sunsetSky)"/>

  <!-- Rosy Sunset Cloud Strata (煙霞) -->
  <path d="M0 240 Q 250 180 500 230 T 1000 190 Q 1120 200 1200 220 L 1200 350 L 0 350 Z" fill="#F39C6B" opacity="0.45"/>
  <path d="M100 280 Q 400 220 700 270 T 1200 240 L 1200 390 L 0 390 Z" fill="#D96B75" opacity="0.35"/>

  <!-- Majestic Mountain Silhouettes in Sunset -->
  <path d="M0 380 L 180 290 L 360 370 L 580 280 L 800 360 L 1050 270 L 1200 320 L 1200 675 L 0 675 Z" fill="#583150" opacity="0.6"/>
  <path d="M0 430 L 220 340 L 450 420 L 680 330 L 920 410 L 1180 340 L 1200 350 L 1200 675 L 0 675 Z" fill="#3D213B" opacity="0.8"/>

  <!-- Distant Busy Mortal World in the Valley Below (塵籠 - 먼지 자욱한 속세 마을) -->
  <g transform="translate(850, 470)" fill="url(#dustCityGrad)" opacity="0.85">
    <!-- Distant town roofs and gates enveloped in dusty hazy mist -->
    <rect x="20" y="30" width="35" height="25"/>
    <path d="M12 30 L 37 15 L 62 30 Z"/>
    <rect x="75" y="25" width="45" height="30"/>
    <path d="M65 25 L 97 10 L 130 25 Z"/>
    <rect x="140" y="35" width="30" height="20"/>
    <path d="M132 35 L 155 22 L 178 35 Z"/>
    <rect x="190" y="20" width="50" height="35"/>
    <path d="M180 20 L 215 5 L 250 20 Z"/>
  </g>
  <!-- Valley dust and smoke rising (塵) -->
  <ellipse cx="980" cy="490" rx="180" ry="25" fill="#E8C39E" opacity="0.3"/>

  <!-- Foreground Mountain Path winding downward (廻步 - 발길을 돌려) -->
  <path d="M150 675 Q 320 540 460 520 T 750 510 Q 920 520 1200 580 L 1200 675 Z" fill="url(#pathGrad)"/>
  <path d="M0 500 Q 250 480 460 520 L 320 675 L 0 675 Z" fill="#2E231D"/>

  <!-- Mountain Pathway Stones -->
  <ellipse cx="380" cy="560" rx="45" ry="15" fill="#8C7358" opacity="0.7"/>
  <ellipse cx="480" cy="535" rx="35" ry="12" fill="#8C7358" opacity="0.6"/>
  <ellipse cx="580" cy="525" rx="30" ry="10" fill="#8C7358" opacity="0.6"/>

  <!-- Scholar Boy Pausing on the Mountain Trail, Turning Back to Look at the Peak (廻步 - 발걸음을 돌리다) -->
  <g transform="translate(420, 420) scale(1.05)">
    <!-- Boy Robe -->
    <path d="M25 45 Q 35 75 42 105 L 10 105 Q 12 75 25 45 Z" fill="#FBF8F2" stroke="#3A2D27" stroke-width="2"/>
    <!-- Small Travel Knapsack on back (괴나리봇짐) -->
    <ellipse cx="14" cy="55" rx="14" ry="18" fill="#D8C7B0" stroke="#7A654E" stroke-width="1.8"/>
    <line x1="14" y1="40" x2="30" y2="60" stroke="#7A654E" stroke-width="2"/>
    <!-- Arms walking downward with wooden walking staff -->
    <line x1="45" y1="55" x2="60" y2="105" stroke="#5C4533" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="45" cy="55" r="4.5" fill="#E8B896"/>
    <!-- Head Turned Looking Back Upward at the Rose-tinted Cloud Peak (應笑我) -->
    <circle cx="28" cy="26" r="13" fill="#E8B896"/>
    <!-- Hair & Scholar Headband -->
    <path d="M16 22 Q 28 12 40 22 L 36 14 Q 26 8 18 14 Z" fill="#1C1D1F"/>
    <rect x="25" y="6" width="6" height="8" fill="#1C1D1F" rx="2"/>
    <circle cx="28" cy="5" r="3" fill="#B93826"/>
    <!-- Gentle Nostalgic Smile looking back at the peaks -->
    <circle cx="23" cy="24" r="1.8" fill="#1C1D1F"/>
    <path d="M22 30 Q 25 33 28 30" fill="none" stroke="#B93826" stroke-width="1.6"/>
  </g>

  <!-- Playful Rosy Mist Wisps lingering above (煙霞應笑我 - 미소 짓는 노을과 안개) -->
  <path d="M280 340 Q 400 300 520 330 T 750 310" fill="none" stroke="#FFD8B8" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M340 380 Q 480 350 620 370" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Seal -->
  <rect x="1100" y="45" width="55" height="55" fill="#B93826" rx="8"/>
  <text x="1127" y="80" font-family="'Noto Serif KR', serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">霞</text>
  <text x="1127" y="125" font-family="'Gowun Batang', serif" font-size="16" font-weight="700" fill="#FFE8C2" text-anchor="middle">塵籠</text>
</svg>